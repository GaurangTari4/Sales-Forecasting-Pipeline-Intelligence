name: Verify sales forecasting system

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_forecast_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_forecast_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SALES_FORECAST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sales_forecast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Preflight
        run: python scripts/preflight.py
      - name: Unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
